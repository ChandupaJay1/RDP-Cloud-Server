name: Windows 11 + Tailscale + RDP + Android Studio

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURE WINDOWS RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Configuring Windows Remote Desktop"
          Write-Host "======================================"
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force
          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force
          # Remove existing custom firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          # Allow TCP 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389
          # Enable Windows Remote Desktop firewall rules
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue
          # Restart RDP service
          Restart-Service `
            -Name TermService `
            -Force
          Start-Sleep -Seconds 5
          Write-Host "RDP configuration completed."
      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Creating RDP User"
          Write-Host "======================================"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) {
              $password = "MR.English2008"
          }
          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force
          $existingUser = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue
          if (-not $existingUser) {
              Write-Host "Creating RDP user..."
              New-LocalUser `
                -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Remote Desktop User"
          }
          else {
              Write-Host "RDP user already exists. Updating password..."
              Set-LocalUser `
                -Name "RDP" `
                -Password $securePass
          }
          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue
          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue
          # Verify user
          $userCheck = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue
          if (-not $userCheck) {
              Write-Error "RDP user creation failed."
              exit 1
          }
          Write-Host "RDP user created successfully."
          Write-Host "Username: RDP"
      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Installing Tailscale"
          Write-Host "======================================"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath
          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer was not downloaded."
              exit 1
          }
          Write-Host "Installing Tailscale..."
          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait `
            -PassThru
          Write-Host "Tailscale installer exit code: $($process.ExitCode)"
          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }
          Write-Host "Tailscale installed successfully."
      # ============================================================
      # 4. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Connecting to Tailscale"
          Write-Host "======================================"
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $authKey = "${{ secrets.TAILSCALE_AUTHKEY }}"
          if ([string]::IsNullOrWhiteSpace($authKey)) {
              $authKey = "tskey-auth-kcrNV5GL4121CNTRL-5L5H5memHW66ShCybDu3W63q1KduprEg"
          }
          & $tailscale up `
            --authkey="$authKey" `
            --hostname="rdp-runner" `
            --accept-routes=false
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale authentication failed."
              exit 1
          }
          Write-Host "Tailscale connected."
          Start-Sleep -Seconds 5
          $tsIP = $null
          for ($i = 1; $i -le 20; $i++) {
              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()
              if ($tsIP) {
                  break
              }
              Write-Host "Waiting for Tailscale IP..."
              Start-Sleep -Seconds 3
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }
          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append
          Write-Host ""
          Write-Host "======================================"
          Write-Host " TAILSCALE CONNECTED"
          Write-Host " IP: $tsIP"
          Write-Host "======================================"
      # ============================================================
      # 5. INSTALL ANDROID STUDIO
      # ============================================================
      - name: Install Android Studio
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Installing Android Studio"
          Write-Host "======================================"
          $studioDir  = "C:\Program Files\Android\Android Studio"
          $studioPath = "$studioDir\bin\studio64.exe"

          if (Test-Path $studioPath) {
              Write-Host "Android Studio already installed."
          }
          else {
              Write-Host "Installing Android Studio via Chocolatey..."
              choco install androidstudio --package-parameters="/AddToDesktop" -y --no-progress
          }

          # Locate the executable (choco or default install)
          $found = @(
              "C:\Program Files\Android\Android Studio\bin\studio64.exe",
              "C:\Program Files\Android Studio\bin\studio64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $found) {
              Write-Error "Android Studio executable was not found."
              exit 1
          }

          Write-Host "Android Studio found: $found"
          $studioBinDir = Split-Path $found -Parent
          $studioHomeDir = Split-Path $studioBinDir -Parent

          # Disable Android Studio First-Run Wizard so it won't prompt to download/setup SDK
          $ideaProps = Join-Path $studioBinDir "idea.properties"
          if (Test-Path $ideaProps) {
              $propsContent = Get-Content $ideaProps -Raw -ErrorAction SilentlyContinue
              if ($propsContent -notmatch "disable\.android\.first\.run") {
                  Write-Host "Disabling Android Studio first-run wizard in idea.properties..."
                  Add-Content -Path $ideaProps -Value "`ndisable.android.first.run=true`n"
              }
          }

          # Detect bundled JBR (JetBrains Runtime)
          $jbrPath = Join-Path $studioHomeDir "jbr"
          if (Test-Path "$jbrPath\bin\java.exe") {
              Write-Host "Configuring bundled Java runtime (JBR): $jbrPath"
              [Environment]::SetEnvironmentVariable("JAVA_HOME", $jbrPath, "Machine")
              $env:JAVA_HOME = $jbrPath
              "JAVA_HOME=$jbrPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          # Create Desktop Shortcut for all users (shows on RDP user's desktop)
          $wscript = New-Object -ComObject WScript.Shell
          $publicDesktop = "C:\Users\Public\Desktop"
          if (-not (Test-Path $publicDesktop)) { New-Item -ItemType Directory -Path $publicDesktop -Force | Out-Null }
          $shortcutPath = Join-Path $publicDesktop "Android Studio.lnk"
          $shortcut = $wscript.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = $found
          $shortcut.WorkingDirectory = $studioBinDir
          $shortcut.Description = "Android Studio"
          $shortcut.Save()
          Write-Host "Created public desktop shortcut: $shortcutPath"

          Write-Host ""
          Write-Host "======================================"
          Write-Host " Android Studio installed successfully"
          Write-Host "======================================"
          Write-Host "Path: $found"

      # ============================================================
      # 6. CONFIGURE ANDROID SDK & ENVIRONMENT VARIABLES
      # ============================================================
      - name: Configure Android SDK
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Configuring Android SDK & System Env"
          Write-Host "======================================"

          # Universal SDK path accessible to all users (avoids runneradmin AppData isolation)
          $sdkPath = "C:\Android\Sdk"
          New-Item -ItemType Directory -Path $sdkPath -Force | Out-Null

          # Grant full permissions to Everyone and Users so RDP user can read/write without issue
          icacls "C:\Android" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          icacls "C:\Android" /grant "Users:(OI)(CI)F" /T /Q | Out-Null

          # Set SYSTEM-WIDE (Machine) environment variables so RDP user gets them automatically
          [Environment]::SetEnvironmentVariable("ANDROID_HOME", $sdkPath, "Machine")
          [Environment]::SetEnvironmentVariable("ANDROID_SDK_ROOT", $sdkPath, "Machine")

          # Current PowerShell process
          $env:ANDROID_HOME = $sdkPath
          $env:ANDROID_SDK_ROOT = $sdkPath

          # GitHub Actions step environment
          "ANDROID_HOME=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "ANDROID_HOME     = $sdkPath (Machine)"
          Write-Host "ANDROID_SDK_ROOT = $sdkPath (Machine)"

          # Set into Default User registry so new Windows user profiles inherit it in HKCU as well
          try {
              reg load HKU\DefUser "C:\Users\Default\NTUSER.DAT" 2>$null
              reg add "HKU\DefUser\Environment" /v ANDROID_HOME /t REG_SZ /d "$sdkPath" /f 2>$null
              reg add "HKU\DefUser\Environment" /v ANDROID_SDK_ROOT /t REG_SZ /d "$sdkPath" /f 2>$null
              reg unload HKU\DefUser 2>$null
          }
          catch {
              Write-Host "Note: Default user profile registry update skipped ($($_.Exception.Message))"
          }

          # ========================================================
          # Download Android Command-Line Tools
          # ========================================================
          $cmdToolsUrl = "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip"
          $cmdToolsZip = "$env:TEMP\commandlinetools.zip"
          $cmdToolsExtract = "$env:TEMP\commandlinetools-extracted"
          Write-Host ""
          Write-Host "Downloading Android Command-Line Tools..."
          try {
              Invoke-WebRequest `
                -Uri $cmdToolsUrl `
                -OutFile $cmdToolsZip `
                -UseBasicParsing
          }
          catch {
              Write-Error "Failed to download Android Command-Line Tools."
              Write-Error $_.Exception.Message
              exit 1
          }
          if (-not (Test-Path $cmdToolsZip)) {
              Write-Error "Command-Line Tools ZIP was not downloaded."
              exit 1
          }
          if (Test-Path $cmdToolsExtract) {
              Remove-Item `
                $cmdToolsExtract `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }
          Expand-Archive `
            -Path $cmdToolsZip `
            -DestinationPath $cmdToolsExtract `
            -Force
          $cmdToolsLatest = "$sdkPath\cmdline-tools\latest"
          New-Item `
            -ItemType Directory `
            -Path $cmdToolsLatest `
            -Force | Out-Null

          # Copy command line tool contents
          Copy-Item `
            "$cmdToolsExtract\cmdline-tools\*" `
            $cmdToolsLatest `
            -Recurse `
            -Force

          # Cleanup
          Remove-Item $cmdToolsZip -Force -ErrorAction SilentlyContinue
          Remove-Item $cmdToolsExtract -Recurse -Force -ErrorAction SilentlyContinue

          # ========================================================
          # Ensure Java is available for sdkmanager
          # ========================================================
          if (-not $env:JAVA_HOME -or -not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
              $possibleJavas = @(
                  "C:\Program Files\Android\Android Studio\jbr",
                  "C:\Program Files\Android Studio\jbr",
                  "$env:JAVA_HOME_17_X64",
                  "$env:JAVA_HOME_21_X64",
                  "$env:JAVA_HOME_11_X64"
              ) | Where-Object { $_ -and (Test-Path "$_\bin\java.exe") }
              if ($possibleJavas.Count -gt 0) {
                  $env:JAVA_HOME = $possibleJavas[0]
                  [Environment]::SetEnvironmentVariable("JAVA_HOME", $env:JAVA_HOME, "Machine")
                  "JAVA_HOME=$($env:JAVA_HOME)" | Out-File -FilePath $env:GITHUB_ENV -Append
              }
          }
          Write-Host "Using JAVA_HOME: $env:JAVA_HOME"

          $sdkManager = "$cmdToolsLatest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
              Write-Error "sdkmanager.bat was not found at $sdkManager."
              exit 1
          }
          Write-Host ""
          Write-Host "sdkmanager found: $sdkManager"

          # ========================================================
          # Accept Android SDK licenses
          # ========================================================
          Write-Host ""
          Write-Host "Configuring Android SDK licenses..."
          $licenseDir = "$sdkPath\licenses"
          New-Item -ItemType Directory -Path $licenseDir -Force | Out-Null
          @(
              "24333f8a63b6825ea9c5514f83c2829b004d1fee"
              "89338d0d9b1836777773a6c144e14e4ff9da0773"
              "d56f5187479451eabf01fb78af6dfcb131a6481e"
          ) | Set-Content -Path "$licenseDir\android-sdk-license" -Force -Encoding ASCII

          @(
              "84831b9409646a918e30573bab4c9c91346d8abd"
          ) | Set-Content -Path "$licenseDir\android-sdk-preview-license" -Force -Encoding ASCII

          @(
              "33b6a2b649200299fce170a4c085c966f7ad9457"
          ) | Set-Content -Path "$licenseDir\google-gdk-license" -Force -Encoding ASCII

          # Accept all interactive licenses
          cmd /c "echo y | `"$sdkManager`" --sdk_root=`"$sdkPath`" --licenses" | Out-Null

          # ========================================================
          # Install required Android SDK packages
          # ========================================================
          Write-Host ""
          Write-Host "Installing Android SDK packages (platform-tools, platforms;android-35, build-tools;35.0.0)..."
          & $sdkManager `
            --sdk_root="$sdkPath" `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0"

          # Fallback check for platform-tools: ensure adb.exe is definitely installed!
          $platformTools = "$sdkPath\platform-tools"
          if (-not (Test-Path "$platformTools\adb.exe")) {
              Write-Warning "platform-tools not found after sdkmanager, downloading directly from Google..."
              $ptUrl = "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
              $ptZip = "$env:TEMP\platform-tools.zip"
              Invoke-WebRequest -Uri $ptUrl -OutFile $ptZip -UseBasicParsing
              Expand-Archive -Path $ptZip -DestinationPath "$env:TEMP\pt-extract" -Force
              if (Test-Path "$env:TEMP\pt-extract\platform-tools") {
                  if (Test-Path $platformTools) { Remove-Item $platformTools -Recurse -Force -ErrorAction SilentlyContinue }
                  Move-Item "$env:TEMP\pt-extract\platform-tools" $platformTools -Force
              }
              Remove-Item "$env:TEMP\pt-extract" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $ptZip -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path "$platformTools\adb.exe") {
              Write-Host "adb.exe successfully verified: $platformTools\adb.exe"
          } else {
              Write-Error "Failed to install platform-tools."
              exit 1
          }

          # ========================================================
          # Add Android tools to SYSTEM-WIDE (Machine) PATH
          # ========================================================
          $cmdlineToolsBin = "$cmdToolsLatest\bin"
          $emulator        = "$sdkPath\emulator"
          $toolsBin        = "$sdkPath\tools\bin"
          $tools           = "$sdkPath\tools"
          $studioBin       = "C:\Program Files\Android\Android Studio\bin"
          $jbrBin          = "$env:JAVA_HOME\bin"

          $androidPaths = @(
              $platformTools,
              $cmdlineToolsBin,
              $emulator,
              $toolsBin,
              $tools
          )
          if (Test-Path $studioBin) { $androidPaths += $studioBin }
          if ($jbrBin -and (Test-Path $jbrBin)) { $androidPaths += $jbrBin }

          # Update Machine PATH
          $machinePath = [Environment]::GetEnvironmentVariable("PATH", "Machine")
          $pathEntries = [System.Collections.Generic.List[string]]::new()
          foreach ($p in $androidPaths) {
              if (-not $pathEntries.Contains($p)) { $pathEntries.Add($p) }
          }
          foreach ($p in ($machinePath -split ';')) {
              if ($p -and -not $pathEntries.Contains($p)) { $pathEntries.Add($p) }
          }
          $updatedMachinePath = $pathEntries -join ';'

          [Environment]::SetEnvironmentVariable("PATH", $updatedMachinePath, "Machine")

          # Update current process PATH & GitHub Environment PATH
          $env:PATH = "$($androidPaths -join ';');$env:PATH"
          foreach ($p in $androidPaths) {
              $p | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          Write-Host "Updated System (Machine) PATH with platform-tools and cmdline-tools."

          # ========================================================
          # Setup Directory Junctions & User Profile Automation
          # ========================================================
          # Junction for runneradmin
          $adminLocal = "$env:LOCALAPPDATA\Android"
          New-Item -ItemType Directory -Path $adminLocal -Force | Out-Null
          if (-not (Test-Path "$adminLocal\Sdk")) {
              cmd /c "mklink /J `"$adminLocal\Sdk`" `"$sdkPath`"" | Out-Null
          }

          # Auto-configure Startup script so when user 'RDP' logs in:
          # 1. LocalAppData junction (%LOCALAPPDATA%\Android\Sdk -> C:\Android\Sdk) is created
          # 2. User-level ANDROID_HOME and ANDROID_SDK_ROOT are synchronized
          # 3. First-run analytics prompts are suppressed
          $startupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
          New-Item -ItemType Directory -Path $startupFolder -Force | Out-Null
          $startupScript = Join-Path $startupFolder "setup-android-user.bat"

          @(
              "@echo off"
              ":: Automatically configure RDP user session for Android Studio & SDK"
              'if not exist "%LOCALAPPDATA%\Android" mkdir "%LOCALAPPDATA%\Android"'
              'if not exist "%LOCALAPPDATA%\Android\Sdk" mklink /J "%LOCALAPPDATA%\Android\Sdk" "C:\Android\Sdk" >nul 2>&1'
              ""
              ":: Ensure user-level environment variables match system variables"
              'setx ANDROID_HOME "C:\Android\Sdk" >nul 2>&1'
              'setx ANDROID_SDK_ROOT "C:\Android\Sdk" >nul 2>&1'
              ""
              ":: Disable usage statistics prompt"
              'if not exist "%USERPROFILE%\.android" mkdir "%USERPROFILE%\.android"'
              'echo [General] > "%USERPROFILE%\.android\analytics.settings"'
              'echo opt-in=false >> "%USERPROFILE%\.android\analytics.settings"'
          ) | Set-Content -Path $startupScript -Force -Encoding ASCII

          Write-Host "Configured user startup initialization script at: $startupScript"

          # Create a desktop test shortcut for the user
          $publicDesktop = "C:\Users\Public\Desktop"
          $testBat = Join-Path $publicDesktop "Test Android SDK.bat"
          @(
              "@echo off"
              "echo ============================================================"
              "echo           ANDROID ENVIRONMENT VERIFICATION"
              "echo ============================================================"
              "echo."
              "echo ANDROID_HOME     : %ANDROID_HOME%"
              "echo ANDROID_SDK_ROOT : %ANDROID_SDK_ROOT%"
              "echo JAVA_HOME        : %JAVA_HOME%"
              "echo."
              "echo --- Testing ADB (platform-tools) ---"
              "adb version"
              "echo."
              "echo --- Testing SDK Manager ---"
              "call sdkmanager --version"
              "echo."
              "echo --- Testing Java ---"
              "java -version"
              "echo."
              "echo ============================================================"
              "echo If all tools above showed versions, setup is 100%% complete!"
              "echo ============================================================"
              "pause"
          ) | Set-Content -Path $testBat -Force -Encoding ASCII

          Write-Host "Created desktop verification utility at: $testBat"

          # Re-apply ACLs to ensure RDP user has full permissions everywhere in C:\Android
          icacls "C:\Android" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          icacls "C:\Android" /grant "Users:(OI)(CI)F" /T /Q | Out-Null

          Write-Host ""
          Write-Host "======================================"
          Write-Host " Android SDK configured successfully"
          Write-Host "======================================"
          Write-Host "SDK: $sdkPath"
          Write-Host "ADB Version:"
          & "$platformTools\adb.exe" --version
      # ============================================================
      # 7. VERIFY RDP SERVICE
      # ============================================================
      - name: Verify RDP Service
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " Verifying RDP"
          Write-Host "======================================"
          $service = Get-Service `
            -Name TermService `
            -ErrorAction Stop
          Write-Host "TermService status: $($service.Status)"
          if ($service.Status -ne "Running") {
              Write-Host "Starting Remote Desktop service..."
              Start-Service `
                -Name TermService
              Start-Sleep -Seconds 5
          }
          Write-Host ""
          Write-Host "Checking TCP 3389..."
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue
          if (-not $listener) {
              Write-Error "Nothing is listening on TCP port 3389."
              exit 1
          }
          Write-Host "TCP 3389 is listening."
          $listener |
            Format-Table `
              LocalAddress,
              LocalPort,
              State
      # ============================================================
      # 8. VERIFY TAILSCALE + RDP
      # ============================================================
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " RDP ACCESS"
          Write-Host "======================================"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Port: 3389"
          Write-Host ""
          Write-Host "Testing TCP 3389..."
          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              Write-Host ""
              Write-Host "Tailscale status:"
              & "$env:ProgramFiles\Tailscale\tailscale.exe" status
              exit 1
          }
          Write-Host ""
          Write-Host "TCP connectivity successful!"
      # ============================================================
      # 9. DOWNLOAD Downloads.bat
      # ============================================================
      - name: Download Downloads.bat
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 20
        run: |
          Write-Host "======================================"
          Write-Host " Downloading Downloads.bat"
          Write-Host "======================================"
          $url  = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $path = "$env:TEMP\Downloads.bat"
          $out  = "$env:TEMP\downloads-out.log"
          $err  = "$env:TEMP\downloads-err.log"
          Invoke-WebRequest -Uri $url -OutFile $path -UseBasicParsing
          if (-not (Test-Path $path)) {
              Write-Error "Downloads.bat was not downloaded."
              exit 1
          }
          Write-Host "Downloads.bat downloaded. Starting..."
          # stdin = NUL so `pause` etc. can't block; output goes to files
          $p = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "`"$path`" < NUL" `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -WindowStyle Hidden `
            -PassThru
          # Wait up to 10 minutes, then move on
          $p | Wait-Process -Timeout 600 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) {
              Write-Warning "Downloads.bat still running after 10 min. Continuing without it."
          }
          else {
              Write-Host "Downloads.bat exit code: $($p.ExitCode)"
          }
          Write-Host "---- Downloads.bat output ----"
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
      # ============================================================
      # 10. FINAL RDP INFORMATION + KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain RDP Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Fixed Domain : rdp-runner.tail406778.ts.net"
          Write-Host "Hostname     : rdp-runner"
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : RDP"
          Write-Host "Password     : MR.English2008"
          Write-Host "Port         : 3389"
          Write-Host ""
          Write-Host "Android Studio has been installed."
          Write-Host ""
          Write-Host "Connect using Windows Remote Desktop (MSTSC):"
          Write-Host ""
          Write-Host "    rdp-runner.tail406778.ts.net"
          Write-Host "    (or: rdp-runner  /  $env:TAILSCALE_IP)"
          Write-Host ""
          Write-Host "Then open:"
          Write-Host ""
          Write-Host "    Android Studio"
          Write-Host ""
          Write-Host "=============================================="
          $studioPath = @(
              "C:\Program Files\Android\Android Studio\bin\studio64.exe",
              "C:\Program Files\Android Studio\bin\studio64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($studioPath) {
              Write-Host ""
              Write-Host "Android Studio executable: $studioPath"
          }
          Write-Host ""
          Write-Host "Android SDK   : $env:ANDROID_HOME"
          Write-Host "Java Runtime  : $env:JAVA_HOME"
          if (Test-Path "$env:ANDROID_HOME\platform-tools\adb.exe") {
              Write-Host "ADB Tool      : $env:ANDROID_HOME\platform-tools\adb.exe"
          }
          Write-Host ""
          Write-Host "Checking RDP service..."
          Get-Service TermService |
            Format-Table Status, Name
          Write-Host ""
          Write-Host "Checking port 3389..."
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table LocalAddress, LocalPort, State
          Write-Host ""
          Write-Host "Tailscale status:"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP SERVER IS READY"
          Write-Host "=============================================="
          # Keep GitHub Actions runner alive for ~5 hours 45 minutes (345 min)
          $startTime = Get-Date
          $maxMinutes = 345
          while ((Get-Date) -lt $startTime.AddMinutes($maxMinutes)) {
              $elapsed = [math]::Round(((Get-Date) - $startTime).TotalMinutes, 1)
              Write-Host "[$(Get-Date)] RDP Active ($elapsed / $maxMinutes min) - Connect: rdp-runner.tail406778.ts.net"
              Start-Sleep -Seconds 300
          }
          Write-Host "Session reached 345 minutes limit. Logging out Tailscale for next run..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
